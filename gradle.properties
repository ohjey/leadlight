org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# The game this build is for, when the command line does not say: -Pminecraft=26.3 builds the other
# one. The game, the Metal backend and everything that follows them are in versions/<this>.properties.
# Metallum patches the game's renderer from the inside and this mod reaches into Metallum's own
# classes, so each build accepts only the one Metallum release it was built and checked against.
minecraft=26.2
loader_version=0.19.5
fabric_loader_min_version=0.19.3
loom_version=1.16-SNAPSHOT


mod_id=leadlight
mod_version=0.2.0
maven_group=dev.leadlight
upstream_version=0.13.0-beta

junit_version=5.13.4
