plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+vitrail.${project.upstream_version}+metallum.${project.metallum_version}"
group = project.maven_group

base {
	archivesName = 'vitrail-metallum'
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Metallum is the Metal backend this engine draws through. Its render classes are reached
	// directly (from dev.vitrailmetal.metal and from com.metallum.render.VitrailMetalBridge), so it is
	// on the compile classpath as well as the dev client's.
	implementation "maven.modrinth:metallum-mc:${project.metallum_version}"

	// Sodium draws the terrain, and the engine hooks its chunk renderer.
	implementation "maven.modrinth:sodium:${project.sodium_version}"

	// The key mapping and the client tick the settings screen is opened by, and nothing else.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	runtimeOnly "maven.modrinth:modmenu:${project.modmenu_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

loom {
	runs {
		client {
			// Apple's Metal API validation, on request: -PmetalValidation
			if (project.hasProperty('metalValidation')) {
				environmentVariable 'MTL_DEBUG_LAYER', '1'
				environmentVariable 'MTL_SHADER_VALIDATION', '1'
			}
			def extra = project.findProperty('jvmArgs')
			if (extra) {
				vmArgs(*extra.toString().split(' '))
			}
		}
	}
}

processResources {
	def metadata = [
		mod_id: project.mod_id,
		mod_version: project.version,
		minecraft_version: project.minecraft_version,
		minecraft_next: project.minecraft_next,
		fabric_loader_min_version: project.fabric_loader_min_version,
		metallum_version: project.metallum_version
	]
	inputs.properties(metadata)

	filesMatching('fabric.mod.json') {
		expand(metadata)
	}

	from('src/main/resources/vitrail.png') {
		into 'assets/vitrail/textures/gui'
		rename { 'config-icon.png' }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
	def runDir = layout.buildDirectory.dir('test-run')
	workingDir = runDir
	doFirst { runDir.get().asFile.mkdirs() }
}

jar {
	from(rootDir) {
		include 'LICENSE'
		include 'GPL-3.0.txt'
		include 'NOTICE'
	}
}
