plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Which game this build is for, and everything that moves with it, out of versions/<game>.properties.
// Sources that differ between the two games are whole files under src/mc<game>/ beside src/main/,
// added to the build rather than laid over it, as upstream Vitrail lays them out.
def targetGame = (project.findProperty('minecraft') ?: '26.2').toString()
def versionFile = file("versions/${targetGame}.properties")
if (!versionFile.isFile()) {
	throw new GradleException("No versions/${targetGame}.properties: this mod builds for 26.2 and 26.3")
}
def versionProperties = new Properties()
versionFile.withInputStream { versionProperties.load(it) }
versionProperties.each { key, value -> project.ext.set(key.toString(), value.toString()) }

// Each game builds into a directory of its own, so switching does not throw the other one's away.
layout.buildDirectory = layout.projectDirectory.dir("build/mc${targetGame}")

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = 'leadlight'
}

repositories {
	mavenCentral()
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Metallum is the Metal backend this engine draws through. Its render classes are reached
	// directly (from dev.leadlight.metal and from com.metallum.render.LeadlightMetalBridge), so it is
	// on the compile classpath as well as the dev client's.
	implementation "maven.modrinth:metallum-mc:${project.metallum_version}"

	// From 0.0.25 Metallum wraps Metal in the metal-jvm bindings and ships them inside its own jar,
	// which puts them on the game's classpath but not on the compiler's.
	if (project.hasProperty('metaljvm_version')) {
		compileOnly "io.github.kokodio:metal-jvm:${project.metaljvm_version}"
	}

	// Sodium draws the terrain, and the engine hooks its chunk renderer.
	implementation "maven.modrinth:sodium:${project.sodium_version}"

	// The key mapping and the client tick the settings screen is opened by, and nothing else.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	runtimeOnly "maven.modrinth:modmenu:${project.modmenu_version}"

	// Dev client only, on request (-PwithEtf): the entity texture and model mods Fresh Animations
	// needs, to check the emissive overlays they draw.
	if (project.hasProperty('withEtf')) {
		runtimeOnly "maven.modrinth:entitytexturefeatures:${project.etf_version}"
		runtimeOnly "maven.modrinth:entity-model-features:${project.emf_version}"
	}

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

loom {
	runs {
		client {
			// Each game keeps its own world, options and mods: run/ for 26.2, run-<game>/ otherwise.
			runDir = targetGame == '26.2' ? 'run' : "run-${targetGame}"
			// Apple's Metal API validation, on request: -PmetalValidation
			if (project.hasProperty('metalValidation')) {
				environmentVariable 'MTL_DEBUG_LAYER', '1'
				environmentVariable 'MTL_SHADER_VALIDATION', '1'
			}
			def extra = project.findProperty('jvmArgs')
			if (extra) {
				vmArgs(*extra.toString().split(' '))
			}
		}
	}
}

// -PrunJava=<path to bin/java>: run the dev client on another Java, such as a launcher's bundled
// runtime, whose SDK decides the Metal shader language version left unpinned.
tasks.withType(JavaExec).matching { it.name == 'runClient' }.configureEach {
	def runJava = project.findProperty('runJava')
	if (runJava) {
		javaLauncher.set(null as JavaLauncher)
		executable = runJava.toString()
	}
}

def versionSources = "src/mc${targetGame}"
sourceSets.main.java.srcDir("${versionSources}/java")
sourceSets.main.resources.srcDir("${versionSources}/resources")

// A game that moved classes the shared sources name is given those sources with the names
// rewritten, rather than a copy kept by hand: versions/<game>.remap lists the moves, one class per
// line, Blaze3D's classes to Renderpearl's for 26.3. Upstream Vitrail's rule, applied line by line
// to a copy under build/, so a compiler error on the copy is on the line of the file it came from.
// The dotted name in code and strings, the slashed one in descriptors (how a mixin target names a
// class), and a name only ever matched whole.
def remapFile = file("versions/${targetGame}.remap")
if (remapFile.isFile()) {
	def moves = [:]
	remapFile.eachLine("UTF-8") { line ->
		def text = line.trim()
		if (text.isEmpty() || text.startsWith("#")) {
			return
		}
		def names = text.split(/\s+/)
		if (names.length != 2) {
			throw new GradleException("${remapFile.name}: '${text}' is not a class and where it moved to")
		}
		moves[names[0]] = names[1]
		moves[names[0].replace(".", "/")] = names[1].replace(".", "/")
		moves["L" + names[0].replace(".", "/")] = "L" + names[1].replace(".", "/")
	}
	def quoted = { names -> names.sort { -it.length() }
			.collect { java.util.regex.Pattern.quote(it) }.join("|") }
	def pattern = java.util.regex.Pattern.compile(
			'(?:' + quoted(moves.keySet().findAll { it.startsWith("L") }) + ')(?=[;$<])'
			+ '|(?<![\\w$])(?:' + quoted(moves.keySet().findAll { !it.startsWith("L") })
			+ ')(?!\\w)')
	def remapSources = tasks.register("remapSources", Sync) {
		description = "Rewrites the shared sources onto the class names of Minecraft ${targetGame}."
		inputs.property("moves", moves)
		from("src/main/java")
		into(layout.buildDirectory.dir("generated/sources/remapped/java"))
		filteringCharset = "UTF-8"
		filter { String line ->
			def matcher = pattern.matcher(line)
			def rewritten = new StringBuilder()
			while (matcher.find()) {
				matcher.appendReplacement(rewritten,
						java.util.regex.Matcher.quoteReplacement(moves[matcher.group()]))
			}
			matcher.appendTail(rewritten)
			rewritten.toString()
		}
	}
	sourceSets.main.java.srcDirs = [remapSources, "${versionSources}/java"]
}

processResources {
	def metadata = [
		mod_id: project.mod_id,
		mod_version: project.version,
		minecraft_version: project.minecraft_version,
		minecraft_next: project.minecraft_next,
		fabric_loader_min_version: project.fabric_loader_min_version,
		metallum_version: project.metallum_version
	]
	inputs.properties(metadata)

	filesMatching('fabric.mod.json') {
		expand(metadata)
	}

	from('src/main/resources/leadlight.png') {
		into 'assets/leadlight/textures/gui'
		rename { 'config-icon.png' }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 25
	it.options.compilerArgs += ['-Xmaxerrs', '10000']
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
	def runDir = layout.buildDirectory.dir('test-run')
	workingDir = runDir
	doFirst { runDir.get().asFile.mkdirs() }
}

jar {
	from(rootDir) {
		include 'LICENSE'
		include 'GPL-3.0.txt'
		include 'NOTICE'
	}
}
